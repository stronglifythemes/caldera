      ctx.fillStyle = jugador.arma === 4 ? '#ff6a1a' : '#2b2838'; ctx.fillRect(-4, -largo, 8, largo);
      ctx.fillStyle = jugador.arma === 4 ? '#ffe9a0' : '#c8c8e6'; ctx.fillRect(-1, -largo + 2, 2, largo - 6);
      ctx.fillStyle = '#ffc83c'; ctx.fillRect(-12, -2, 24, 5); ctx.fillStyle = '#5a3c28'; ctx.fillRect(-3, 3, 6, 14); ctx.restore();
    } else if (jugador.arma === 5) { ctx.fillStyle = '#5a5e66'; ctx.fillRect(bx - 22, by - 34, 18, 44); ctx.fillRect(bx + 4, by - 34, 18, 44); ctx.fillStyle = '#7a5032'; ctx.fillRect(bx - 24, by - 4, 48, 14); if (jugador.retroceso > .6) { ctx.fillStyle = '#fff3c4'; ctx.fillRect(bx - 22, by - 46, 44, 10); } }

  };

  
  estado = 'inicio'; iniciar();
